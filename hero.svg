<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1100 300" width="1100" height="300" role="img" aria-label="Bruno Laizans, Software Engineer, Data Engineering, Aarhus Denmark">
  <title>Bruno Laizans, Software Engineer, Data Engineering</title>

  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#292524"/>
    </pattern>

    <linearGradient id="fadeRight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="dotMask">
      <rect x="0" y="0" width="1100" height="300" fill="url(#fadeRight)"/>
    </mask>

    <path id="p1" d="M700,95 C762,95 800,150 858,150"/>
    <path id="p2" d="M700,150 L858,150"/>
    <path id="p3" d="M700,205 C762,205 800,150 858,150"/>
    <path id="p4" d="M862,150 C924,150 960,118 1014,118"/>
    <path id="p5" d="M862,150 C924,150 960,182 1014,182"/>
  </defs>

  <style>
    /* base state is the finished state, so the art still reads if animation never runs */
    .rise { animation: rise .7s cubic-bezier(.16,1,.3,1) both; }
    .d1 { animation-delay: .10s } .d2 { animation-delay: .22s }
    .d3 { animation-delay: .34s } .d4 { animation-delay: .46s }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    .wire { stroke: #3f6212; stroke-width: 1.5; fill: none; stroke-dasharray: 220;
            animation: draw 1.1s cubic-bezier(.16,1,.3,1) .3s both; }
    @keyframes draw { from { stroke-dashoffset: 220; } to { stroke-dashoffset: 0; } }

    .node { animation: pop .5s cubic-bezier(.16,1,.3,1) both; }
    .n1 { animation-delay: .55s } .n2 { animation-delay: .70s } .n3 { animation-delay: .85s }
    @keyframes pop { from { opacity: 0; } to { opacity: 1; } }

    .caret { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }

    .core { transform-box: fill-box; transform-origin: center;
            animation: beat 2.6s ease-in-out 1.2s infinite; }
    @keyframes beat { 0%,100% { transform: scale(1); } 50% { transform: scale(1.14); } }

    @media (prefers-reduced-motion: reduce) {
      .rise, .wire, .node, .core, .caret { animation: none; }
      .flow { display: none; }
    }
  </style>

  <rect x="0" y="0" width="1100" height="300" rx="14" fill="#0c0a09"/>
  <rect x="0" y="0" width="1100" height="300" fill="url(#dots)" mask="url(#dotMask)"/>
  <rect x=".75" y=".75" width="1098.5" height="298.5" rx="13.5" fill="none" stroke="#292524"/>

  <!-- left column -->
  <text class="rise d1" x="64" y="86" font-family="ui-monospace,SFMono-Regular,Consolas,monospace"
        font-size="11" letter-spacing="3.4" fill="#84cc16">AARHUS, DENMARK</text>

  <text class="rise d2" x="62" y="152" font-family="Inter,Segoe UI,Helvetica Neue,Arial,sans-serif"
        font-size="58" font-weight="800" letter-spacing="-1.4" fill="#fafaf9">BRUNO LAIZĀNS</text>

  <text class="rise d3" x="64" y="188" font-family="Inter,Segoe UI,Helvetica Neue,Arial,sans-serif"
        font-size="19" font-weight="500" letter-spacing=".2" fill="#a8a29e">Software Engineer, Data Engineering</text>

  <g class="rise d4">
    <text x="64" y="242" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="14" fill="#78716c">
      open_to: <tspan fill="#84cc16">[data engineering, fullstack]</tspan>
    </text>
    <rect class="caret" x="349" y="230" width="8" height="15" fill="#84cc16"/>
  </g>

  <!-- right column: ingest, model, serve -->
  <g font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="10" letter-spacing="2.2" fill="#57534e" text-anchor="middle">
    <text class="rise d3" x="700" y="56">INGEST</text>
    <text class="rise d3" x="860" y="56">MODEL</text>
    <text class="rise d3" x="1014" y="56">SERVE</text>
  </g>

  <use href="#p1" xlink:href="#p1" class="wire"/>
  <use href="#p2" xlink:href="#p2" class="wire"/>
  <use href="#p3" xlink:href="#p3" class="wire"/>
  <use href="#p4" xlink:href="#p4" class="wire"/>
  <use href="#p5" xlink:href="#p5" class="wire"/>

  <g class="node n1" fill="#0c0a09" stroke="#84cc16" stroke-width="1.6">
    <circle cx="700" cy="95" r="6.5"/>
    <circle cx="700" cy="150" r="6.5"/>
    <circle cx="700" cy="205" r="6.5"/>
  </g>

  <g class="node n2">
    <g transform="rotate(45 860 150)">
      <rect class="core" x="843" y="133" width="34" height="34" rx="4"
            fill="#0c0a09" stroke="#84cc16" stroke-width="1.8"/>
    </g>
    <circle cx="860" cy="150" r="3.5" fill="#84cc16"/>
  </g>

  <g class="node n3" fill="#84cc16">
    <circle cx="1014" cy="118" r="6.5"/>
    <circle cx="1014" cy="182" r="6.5"/>
  </g>

  <g class="flow" fill="#a3e635">
    <circle r="3"><animateMotion dur="2.4s" begin="1.4s" repeatCount="indefinite"><mpath href="#p1" xlink:href="#p1"/></animateMotion></circle>
    <circle r="3"><animateMotion dur="2.4s" begin="2.0s" repeatCount="indefinite"><mpath href="#p2" xlink:href="#p2"/></animateMotion></circle>
    <circle r="3"><animateMotion dur="2.4s" begin="2.6s" repeatCount="indefinite"><mpath href="#p3" xlink:href="#p3"/></animateMotion></circle>
    <circle r="3"><animateMotion dur="2.2s" begin="3.2s" repeatCount="indefinite"><mpath href="#p4" xlink:href="#p4"/></animateMotion></circle>
    <circle r="3"><animateMotion dur="2.2s" begin="3.8s" repeatCount="indefinite"><mpath href="#p5" xlink:href="#p5"/></animateMotion></circle>
  </g>
</svg>
